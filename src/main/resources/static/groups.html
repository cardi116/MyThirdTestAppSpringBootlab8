<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список учебных групп</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Список учебных групп</h2>
        <a href="/students.html" class="btn btn-outline-secondary">Перейти к студентам</a>
    </div>

    <div class="card p-3 my-3">
        <h5>Добавить группу</h5>
        <div class="form-row">
            <div class="col">
                <input id="groupName" type="text" class="form-control" placeholder="Название группы">
            </div>
            <div class="col">
                <input id="faculty" type="text" class="form-control" placeholder="Факультет">
            </div>
            <div class="col">
                <input id="count" type="number" class="form-control" placeholder="Количество студентов">
            </div>
            <div class="col-auto">
                <button class="btn btn-primary" onclick="addGroup()">Сохранить</button>
            </div>
        </div>
    </div>

    <table class="table table-bordered table-striped mt-3">
        <thead class="thead-dark">
        <tr>
            <th>ID</th>
            <th>Группа</th>
            <th>Факультет</th>
            <th>Студентов</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="groupsTableBody"></tbody>
    </table>
</div>

<script>
    async function loadGroups() {
        const res = await fetch('/api/groups');
        const data = await res.json();
        const tbody = document.getElementById('groupsTableBody');
        tbody.innerHTML = '';
        data.forEach(g => {
            tbody.innerHTML += `
                <tr>
                    <td>${g.id}</td>
                    <td>${g.name || ''}</td>
                    <td>${g.faculty || ''}</td>
                    <td>${g.studentsCount || ''}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteGroup(${g.id})">Удалить</button>
                    </td>
                </tr>`;
        });
    }

    async function addGroup() {
        const name = document.getElementById('groupName').value;
        const faculty = document.getElementById('faculty').value;
        const studentsCount = document.getElementById('count').value;

        await fetch('/api/groups', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, faculty, studentsCount })
        });
        document.getElementById('groupName').value = '';
        document.getElementById('faculty').value = '';
        document.getElementById('count').value = '';
        loadGroups();
    }

    async function deleteGroup(id) {
        await fetch(`/api/groups/${id}`, { method: 'DELETE' });
        loadGroups();
    }

    loadGroups();
</script>
</body>
</html>
