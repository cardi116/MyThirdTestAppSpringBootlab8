<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список студентов</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Список студентов</h2>
        <a href="/groups.html" class="btn btn-outline-secondary">Перейти к учебным группам</a>
    </div>

    <div class="card p-3 my-3">
        <h5>Добавить / Обновить студента</h5>
        <input type="hidden" id="studentId">
        <div class="form-row">
            <div class="col">
                <input id="firstName" type="text" class="form-control" placeholder="Имя">
            </div>
            <div class="col">
                <input id="lastName" type="text" class="form-control" placeholder="Фамилия">
            </div>
            <div class="col">
                <input id="faculty" type="text" class="form-control" placeholder="Факультет">
            </div>
            <div class="col">
                <input id="age" type="number" class="form-control" placeholder="Возраст">
            </div>
            <div class="col-auto">
                <button class="btn btn-primary" onclick="saveStudent()">Сохранить</button>
            </div>
        </div>
    </div>

    <table class="table table-bordered table-striped mt-3">
        <thead class="thead-dark">
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Фамилия</th>
            <th>Факультет</th>
            <th>Возраст</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="studentsTableBody"></tbody>
    </table>
</div>

<script>
    async function loadStudents() {
        const res = await fetch('/api/students');
        const data = await res.json();
        const students = Array.isArray(data) ? data : (data.data || []);
        const tbody = document.getElementById('studentsTableBody');
        tbody.innerHTML = '';
        students.forEach(s => {
            tbody.innerHTML += `
                <tr>
                    <td>${s.id}</td>
                    <td>${s.name || ''}</td>
                    <td>${s.surname || ''}</td>
                    <td>${s.faculty || ''}</td>
                    <td>${s.age || ''}</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="editStudent(${s.id}, '${s.name}', '${s.surname}', '${s.faculty}', ${s.age})">Редактировать</button>
                        <button class="btn btn-sm btn-danger ml-2" onclick="deleteStudent(${s.id})">Удалить</button>
                    </td>
                </tr>`;
        });
    }

    async function saveStudent() {
        const id = document.getElementById('studentId').value;
        const student = {
            name: document.getElementById('firstName').value,
            surname: document.getElementById('lastName').value,
            faculty: document.getElementById('faculty').value,
            age: parseInt(document.getElementById('age').value)
        };
        if (id) student.id = parseInt(id);

        await fetch('/api/students', {
            method: id ? 'PUT' : 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(student)
        });

        document.getElementById('studentId').value = '';
        document.getElementById('firstName').value = '';
        document.getElementById('lastName').value = '';
        document.getElementById('faculty').value = '';
        document.getElementById('age').value = '';
        loadStudents();
    }

    function editStudent(id, name, surname, faculty, age) {
        document.getElementById('studentId').value = id;
        document.getElementById('firstName').value = name;
        document.getElementById('lastName').value = surname;
        document.getElementById('faculty').value = faculty;
        document.getElementById('age').value = age;
    }

    async function deleteStudent(id) {
        await fetch(`/api/students/${id}`, { method: 'DELETE' });
        loadStudents();
    }

    loadStudents();
</script>
</body>
</html>
