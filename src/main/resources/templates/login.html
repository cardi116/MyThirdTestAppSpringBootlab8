<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header text-center">
                <h2>Вход</h2>
            </div>
            <div class="card-body">
                <div th:if="${param.error}" class="alert alert-danger">
                    Неверный email или пароль.
                </div>
                <div th:if="${param.logout}" class="alert alert-success">
                    Вы успешно вышли из системы.
                </div>

                <form method="post" th:action="@{/login}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Email</label>
                        <input type="email" id="username" name="username" class="form-control" placeholder="Введите email" required />
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Введите пароль" required />
                    </div>

                    <div class="mb-3">
                        <button type="submit" class="btn btn-primary w-100">Войти</button>
                    </div>

                    <div class="text-center">
                        <span>Еще не зарегистрированы? </span>
                        <a th:href="@{/register}">Зарегистрироваться</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
