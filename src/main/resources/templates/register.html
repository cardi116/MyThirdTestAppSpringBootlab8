<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header text-center">
                <h2>Регистрация нового пользователя</h2>
            </div>
            <div class="card-body">
                <div th:if="${param.success}" class="alert alert-success">
                    Регистрация прошла успешно! <a th:href="@{/login}">Войдите в систему</a>.
                </div>

                <form method="post" th:action="@{/register/save}" th:object="${user}">
                    <div class="mb-3">
                        <label class="form-label">Имя</label>
                        <input type="text" th:field="*{firstName}" class="form-control" placeholder="Введите имя" />
                        <p class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Фамилия</label>
                        <input type="text" th:field="*{lastName}" class="form-control" placeholder="Введите фамилию" />
                        <p class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="Введите email" />
                        <p class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" th:field="*{password}" class="form-control" placeholder="Введите пароль" />
                        <p class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    </div>

                    <div class="mb-3">
                        <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
                    </div>
                    <span>Уже есть аккаунт? <a th:href="@{/login}">Войти</a></span>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
